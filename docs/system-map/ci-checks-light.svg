<title id="t">CI: unittest, viewer tests, rebuild check</title><desc id="d">A push or pull request starts the contracts job with unittest on Python 3.11 and 3.14. The interface job runs Node controller tests and the bundle, then rebuilds the showcase and requires an empty git diff.</desc>
