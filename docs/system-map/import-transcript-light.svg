<title id="t">import: strict parse, protocol check, snapshot</title><desc id="d">A transcript file is read once with a size bound and parsed with duplicate keys and inexact numbers rejected. The protocol check validates each exchange and the cursor chain. The snapshot sorts tools by name and hashes them.</desc>
